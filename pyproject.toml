[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stochastiq"
version = "0.2.0"
description = "Mesure de l'expressibilité d'un ansatz Qiskit."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "numpy",
    # real_amplitudes (utilisée par les tests et le README) n'existe qu'à partir de Qiskit 1.3.
    "qiskit>=1.3",
    "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]
examples = ["matplotlib", "jupyter"]
dashboard = ["streamlit", "matplotlib", "pylatexenc"]
verify = ["pennylane"]
# OpenQASM 3 pour les ansatz du client (custom_ansatz.load_qasm).
qasm3 = ["qiskit_qasm3_import"]
# Bruit simulé (noise.py), en matrice densité.
noise = ["qiskit-aer"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
# Les tests de l'API (api/tests) se lancent séparément : la bibliothèque n'a aucune dépendance web.
testpaths = ["tests"]
